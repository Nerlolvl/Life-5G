# CarrierSIM — привязка SIM к системному пакету оператора iOS.
# Адаптация под life:) Беларусь (MCC 257, MNC 04) с расчётом на 5G.
# Формат: «default: ИмяПакета» или «MCCMNC: ИмяПакета» (MCCMNC без пробела,
# например 257 04 = life:) BY). Комментарии начинаются с #.
#
# В проекте один пакет: Turkcell_lifecell_ua («Life», lifecell Украина) —
# переключатель 5G, EVS и VoLTE включены. Родной пакет Беларуси (life_by)
# 5G прячет и EVS отключает. Разрешённые частоты 5G задаёт подписанный файл
# GRI в Default.bundle самой iOS — скрипт (и любой пакет) его не меняет.
# Каталог всех пакетов iOS: https://ios-bundles.github.io

default: Turkcell_lifecell_ua

### Беларусь: 5G, EVS и VoLTE через пакет «Life»
# A1 BY
25701: Turkcell_lifecell_ua
# второй оператор BY
25702: Turkcell_lifecell_ua
# Life BY — основной вариант для 5G
25704: Turkcell_lifecell_ua
# Beltelecom
25705: Turkcell_lifecell_ua
# BeCloud / UNET
25706: Turkcell_lifecell_ua
